db:
  host:     "localhost"
  port:     5432
  user:     "postgres"
  password: ""                # set with environment variable APP_DB_PASSWORD
  dbname:   "cp_scheduler"
  sslmode:  "disable"
  
scheduler:
  interval: "2s"
  batch_size: 50

rabbit:
  url: "amqp://dev:dev@localhost:5672/"

server:
  port: 8082
  shutdown_timeout_seconds: 5